services:
  ollama:
    image: ollama/ollama:latest
    container_name: analyse-stocks-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /opt/init/pull-model.sh
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    volumes:
      - ./docker/ollama:/opt/init:ro
      - ollama_data:/root/.ollama
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: analyse-stocks-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.4-alpine
    container_name: analyse-stocks-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-analysis}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok."]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  parsing-service:
    build:
      context: .
      dockerfile: docker/python-service/Dockerfile
      args:
        SERVICE_MODULE: analyse_stocks.services.parsing_service
    container_name: analyse-stocks-parsing-service
    environment:
      GRPC_PORT: 50052
    ports:
      - "${PARSING_SERVICE_PORT:-50052}:50052"
    restart: unless-stopped

  kpi-extraction-service:
    build:
      context: .
      dockerfile: docker/python-service/Dockerfile
      args:
        SERVICE_MODULE: analyse_stocks.services.kpi_extraction_service
    container_name: analyse-stocks-kpi-extraction-service
    environment:
      GRPC_PORT: 50053
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "${KPI_EXTRACTION_SERVICE_PORT:-50053}:50053"
    restart: unless-stopped

  client-api:
    build:
      context: .
      dockerfile: docker/python-service/Dockerfile
      args:
        SERVICE_MODULE: analyse_stocks.services.client_api
    container_name: analyse-stocks-client-api
    environment:
      GRPC_PORT: 50051
      PARSING_SERVICE_ADDRESS: parsing-service:50052
      KPI_EXTRACTION_SERVICE_ADDRESS: kpi-extraction-service:50053
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-analysis}
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      parsing-service:
        condition: service_started
      kpi-extraction-service:
        condition: service_started
    ports:
      - "${CLIENT_API_PORT:-50051}:50051"
    restart: unless-stopped

volumes:
  ollama_data:
  redis_data:
  clickhouse_data:
