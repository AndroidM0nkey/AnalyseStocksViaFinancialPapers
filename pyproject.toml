[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse-stocks-via-financial-papers"
version = "0.1.0"
description = "Microservices platform for analysing stocks via financial papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect==0.8.18",
  "grpcio==1.73.0",
  "grpcio-health-checking==1.73.0",
  "grpcio-reflection==1.73.0",
  "grpcio-tools==1.73.0",
  "httpx==0.28.1",
  "pdfplumber==0.11.6",
  "protobuf==6.31.1",
  "redis[hiredis]==6.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
